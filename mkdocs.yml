site_name: fpm-rs documentation
site_description: Image-plane Fourier ptychographic microscopy reconstruction and simulation
site_dir: site
site_url: !ENV [MKDOCS_SITE_URL, ""]
repo_url: !ENV [MKDOCS_REPO_URL, ""]
repo_name: fpm-rs
edit_uri: !ENV [MKDOCS_EDIT_URI, ""]
hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocs-jupyter:
      # These docs publish notebooks only; skip Jupytext/Pandoc probing of
      # ordinary Markdown, where mkdocstrings directives resemble fenced divs.
      ignore:
        - "*.md"
        - "*.py"
      include:
        - docs/tutorials/notebooks/quickstart.ipynb
        - docs/tutorials/notebooks/synthetic_objects_quickstart.ipynb
        - docs/tutorials/notebooks/diagnostics_quickstart.ipynb
      execute: false
      include_source: true
      allow_errors: false
  - mkdocstrings:
      handlers:
        python:
          paths: [target/docs-python-api]
          inventories: []
          options:
            allow_inspection: false
            docstring_style: numpy
            docstring_options:
              warn_unknown_params: false
            heading_level: 2
            filters: public
            inherited_members: true
            merge_init_into_class: true
            members: true
            members_order: source
            separate_signature: true
            show_category_heading: false
            show_attribute_values: false
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

watch:
  - python/fpm_rs

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Concepts and conventions: concepts/core-concepts.md
      - Glossary: concepts/glossary.md
  - User guide:
      - Reconstruction workflow: guides/reconstruction.md
      - Measurements and acquisitions: guides/measurements.md
      - Simulation: guides/simulation.md
      - Image metrics: metrics.md
      - Diagnostics and callbacks: diagnostics.md
      - Datasets: datasets.md
      - Configuration schema: configuration-schema.md
      - Spherical illumination geometries: spherical-geometries.md
      - Troubleshooting: troubleshooting.md
  - Examples:
      - Overview: tutorials/index.md
      - First reconstruction: tutorials/notebooks/quickstart.ipynb
      - Synthetic objects: tutorials/notebooks/synthetic_objects_quickstart.ipynb
      - Reconstruction diagnostics: tutorials/notebooks/diagnostics_quickstart.ipynb
  - API reference:
      - Overview: reference/index.md
      - Python API:
          - Package overview: reference/python/index.md
          - Datasets: reference/python/datasets.md
          - Experiment and illumination: reference/python/experiment.md
          - Models and measurements: reference/python/model-and-measurements.md
          - Simulation: reference/python/simulation.md
          - Reconstruction algorithms: reference/python/algorithms.md
          - Results and bundles: reference/python/results-and-bundles.md
          - Callbacks and diagnostics: reference/python/diagnostics.md
          - Evaluation and metrics: reference/python/evaluation-and-metrics.md
      - Rust API: reference/rust.md
  - Development:
      - Contributor guide: development/index.md
      - Benchmarks: benchmarks.md
  - Project:
      - Citation, license, and roadmap: project.md
