default_install_hook_types = ["pre-commit", "pre-push"]
exclude.glob = [
  ".vscode/**",
  "output/**",
  "target/**",
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "check-case-conflict" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-xml" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-symlinks" },
  { id = "check-merge-conflict", args = ["--assume-in-merge"] },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "rust-format"
name = "Format Rust files with rustfmt"
language = "system"
entry = "pixi run format-rust"
pass_filenames = false
types = ["rust"]

[[repos.hooks]]
id = "toml-format"
name = "Format TOML files with Tombi"
language = "system"
entry = "pixi run tombi format"
exclude = "^Cargo\\.lock$"
types = ["toml"]

[[repos.hooks]]
id = "toml-lint"
name = "Lint TOML files with Tombi"
language = "system"
entry = "pixi run tombi lint"
exclude = "^Cargo\\.lock$"
types = ["toml"]

[[repos.hooks]]
id = "python-format"
name = "Format Python files with Ruff"
language = "system"
entry = "pixi run ruff format"
types = ["python"]

[[repos.hooks]]
id = "typos"
name = "Check spelling with typos"
language = "system"
entry = "pixi run typos"
pass_filenames = false

[[repos.hooks]]
id = "rust-clippy"
name = "Lint Rust files with cargo clippy"
language = "system"
entry = "pixi run cargo clippy --all-targets"
pass_filenames = false
types = ["rust"]
stages = ["pre-push"]
