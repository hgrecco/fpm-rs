[workspace]
name = "fpm-rs"
version = "0.2.0-beta.2"
description = "Development and test environments for the fpm-rs Python bindings"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[environments]
default = ["rust", "python", "pytest", "py312", "lint"]
docs = ["rust", "py312", "docs"]
py312 = ["rust", "python", "pytest", "py312"]
py313 = ["rust", "python", "pytest", "py313"]
py314 = ["rust", "python", "pytest", "py314"]
lint = ["rust", "lint"]

[tasks]
ci = { depends-on = [
  "rust-format",
  "rust-clippy",
  "rust-test",
  "rust-doc",
  "rust-doc-test",
  "rust-examples",
  "rust-msrv",
  "python-api-docs",
  "python-test-full"
], description = "Run the canonical local source-validation suite" }
citation-check = { cmd = "python scripts/check_citations.py", description = "Reject bare or malformed DOI citations in authored documentation" }

[feature.rust.dependencies]
rust = "==1.97"
rust-src = "==1.97"

[feature.rust.tasks]
datasets = "cargo run --bin fpm-datasets --"
rust-clippy = { cmd = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings", description = "Run strict Clippy across the workspace" }
rust-doc = { cmd = "python scripts/check_rust_docs.py", description = "Build all-feature workspace rustdoc with warnings denied" }
rust-doc-test = { cmd = "cargo test --workspace --doc --all-features --locked -j 1", description = "Run Rust documentation tests" }
rust-examples = { cmd = "cargo check --workspace --examples --all-features --locked", description = "Check every Rust example" }
rust-format = { cmd = "cargo fmt --all -- --check", description = "Check Rust formatting" }
rust-msrv = { cmd = "cargo check --workspace --all-targets --locked", description = "Check the workspace with the Pixi-pinned MSRV" }
rust-test = { cmd = "cargo test --workspace --all-features --locked -j 1", description = "Run all Rust tests with all features and serialized linking" }

[feature.python.dependencies]
maturin = ">=1.9,<2"
numpy = ">=2.1"
pip = ">=24"
jupyter = "*"
matplotlib = "*"
ipython = ">=8.30"
polars = ">=1"

[feature.python.tasks]
python-api-docs = { cmd = "python scripts/check_api_docs.py", depends-on = [
  "python-develop"
], description = "Check Python API documentation, runtime/stub synchronization, and citations" }
python-develop = "maturin develop --skip-install --locked"
python = { cmd = "python", depends-on = ["python-develop"] }
jupyter = { cmd = "jupyter", depends-on = ["python-develop"] }
python-wheel = { cmd = "maturin build --release --locked --out dist", description = "Build an optimized local wheel with Maturin" }

[feature.pytest.dependencies]
pytest = ">=8.3"

[feature.pytest.tasks]
python-test = { cmd = "pytest python/tests --ignore=python/tests/test_diagnostic_notebooks.py --ignore=python/tests/test_diagnostics.py --ignore=python/tests/test_plotting.py --deselect=python/tests/test_bundles.py::test_bundle_tables_are_directly_scannable_when_polars_is_installed", depends-on = [
  "python-develop"
], description = "Run the core Python test suite" }
python-test-full = { cmd = "pytest python/tests --junitxml=target/python-full-tests.xml && python scripts/check_pytest_skips.py target/python-full-tests.xml", depends-on = [
  "python-develop"
], description = "Run every Python test and reject dependency-related skips" }
python-test-gil = { cmd = "pytest python/tests/test_gil.py", depends-on = [
  "python-develop"
], description = "Run the Python concurrency tests" }

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.docs.dependencies]
ipykernel = ">=6.29"
maturin = ">=1.9,<2"
matplotlib = ">=3.9"
numpy = ">=2.1"
pip = ">=24"
ruff = "*"

[feature.docs.pypi-dependencies]
mkdocs = ">=1.6,<2"
mkdocs-jupyter = ">=0.25,<1"
mkdocs-material = ">=9.6,<10"
mkdocstrings = { version = ">=0.29,<1", extras = ["python"] }
nbclient = ">=0.10,<1"
pymdown-extensions = ">=10.14,<11"

[feature.docs.tasks]
docs-build = { cmd = "python scripts/build_docs.py", description = "Build the complete MkDocs, Python, notebook, and Rust API site" }
docs-notebooks-check = { cmd = "python scripts/check_notebooks.py", description = "Execute the curated documentation notebooks without modifying their sources" }
docs-preview = { cmd = "python scripts/preview_docs.py", description = "Build and serve the exact combined site at http://127.0.0.1:8000/" }
docs-serve = { cmd = "python scripts/serve_docs.py", description = "Serve Markdown, notebooks, and Python API docs with live reload" }

[feature.lint.dependencies]
prek = "*"
ripgrep = "*"
ruff = "*"
tombi = ">=0.9.1"
typos = "*"

[feature.lint.tasks]
lint = { cmd = "prek --all-files", description = "Run all configured pre-commit checks" }
lint-toml = { cmd = "tombi lint", description = "Lint TOML files" }
format-python = { cmd = "ruff format python", description = "Format Python files" }
format-rust = { cmd = "cargo fmt --all", description = "Format Rust source files" }
format-toml = { cmd = "tombi format", description = "Format TOML files" }
typos = { cmd = "typos", description = "Check spelling" }

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/python"
