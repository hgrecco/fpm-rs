name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - "pixi.lock"
      - "pixi.toml"
      - "pyproject.toml"
      - "python/Cargo.toml"
      - "python/fpm_rs/**"
      - "python/src/**"
      - "scripts/build_docs.py"
      - "scripts/check_notebooks.py"
      - "scripts/mkdocs_hooks.py"
      - "scripts/preview_docs.py"
      - "scripts/serve_docs.py"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true
          environments: docs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - name: Build combined documentation
        run: pixi run docs-build
        env:
          MKDOCS_REPO_URL: https://github.com/${{ github.repository }}
          MKDOCS_EDIT_URI: edit/main/docs/
          MKDOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
