name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - "pixi.lock"
      - "pixi.toml"
      - "pyproject.toml"
      - "python/Cargo.toml"
      - "python/fpm_rs/**"
      - "python/src/**"
      - "scripts/build_docs.py"
      - "scripts/check_api_docs.py"
      - "scripts/check_citations.py"
      - "scripts/check_notebooks.py"
      - "scripts/check_python_api.py"
      - "scripts/check_python_docs.py"
      - "scripts/check_rust_docs.py"
      - "scripts/mkdocs_hooks.py"
      - "scripts/preview_docs.py"
      - "scripts/serve_docs.py"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - "pixi.lock"
      - "pixi.toml"
      - "pyproject.toml"
      - "python/Cargo.toml"
      - "python/fpm_rs/**"
      - "python/src/**"
      - "scripts/build_docs.py"
      - "scripts/check_api_docs.py"
      - "scripts/check_citations.py"
      - "scripts/check_notebooks.py"
      - "scripts/check_python_api.py"
      - "scripts/check_python_docs.py"
      - "scripts/check_rust_docs.py"
      - "scripts/mkdocs_hooks.py"
      - "scripts/preview_docs.py"
      - "scripts/serve_docs.py"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          environments: docs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Validate documentation notebooks
        run: pixi run docs-notebooks-check
      - name: Build combined documentation
        run: pixi run docs-build
        env:
          MKDOCS_REPO_URL: https://github.com/${{ github.repository }}
          MKDOCS_EDIT_URI: edit/main/docs/
          MKDOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
