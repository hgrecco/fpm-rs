name: Hardening

on:
  pull_request:
    paths:
      - ".cargo/audit.toml"
      - ".github/workflows/hardening.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "python/Cargo.toml"
  push:
    branches: [main]
    paths:
      - ".cargo/audit.toml"
      - ".github/workflows/hardening.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "python/Cargo.toml"
  schedule:
    - cron: "31 5 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NIGHTLY_TOOLCHAIN: "nightly-2026-07-15"

jobs:
  dependency-policy:
    name: Dependency advisory and policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Install pinned dependency tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit --file Cargo.lock
      - run: cargo deny --all-features check advisories licenses bans sources

  miri:
    name: Miri array and serialization invariants
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri-${{ env.NIGHTLY_TOOLCHAIN }}
          cache-targets: false
      - run: cargo +${{ env.NIGHTLY_TOOLCHAIN }} miri setup
      - name: Run selected invariant tests under Miri
        run: >-
          cargo +${{ env.NIGHTLY_TOOLCHAIN }} miri test
          -p fpm-rs
          --test complex_tests
          --test configuration_tests
          --locked

  address-sanitizer:
    name: AddressSanitizer array and measurement tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
      ASAN_OPTIONS: detect_leaks=1
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: asan-${{ env.NIGHTLY_TOOLCHAIN }}
          cache-targets: false
      - name: Run selected tests under AddressSanitizer
        run: >-
          cargo +${{ env.NIGHTLY_TOOLCHAIN }} test
          -p fpm-rs
          --test complex_tests
          --test measurement_tests
          --target x86_64-unknown-linux-gnu
          -Zbuild-std
          --locked
