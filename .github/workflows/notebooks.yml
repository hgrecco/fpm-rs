name: Documentation notebooks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/notebooks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "docs/tutorials/notebooks/diagnostics_quickstart.ipynb"
      - "docs/tutorials/notebooks/quickstart.ipynb"
      - "docs/tutorials/notebooks/synthetic_objects_quickstart.ipynb"
      - "pixi.lock"
      - "pixi.toml"
      - "pyproject.toml"
      - "python/Cargo.toml"
      - "python/fpm_rs/**"
      - "python/src/**"
      - "scripts/check_notebooks.py"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/notebooks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "docs/tutorials/notebooks/diagnostics_quickstart.ipynb"
      - "docs/tutorials/notebooks/quickstart.ipynb"
      - "docs/tutorials/notebooks/synthetic_objects_quickstart.ipynb"
      - "pixi.lock"
      - "pixi.toml"
      - "pyproject.toml"
      - "python/Cargo.toml"
      - "python/fpm_rs/**"
      - "python/src/**"
      - "scripts/check_notebooks.py"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true
          environments: docs
      - uses: Swatinem/rust-cache@v2
      - run: pixi run docs-notebooks-check
