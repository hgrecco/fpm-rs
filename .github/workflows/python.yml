name: Python bindings

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - name: Create and activate virtual environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          virtualenv = Path.cwd() / ".venv"
          subprocess.run([sys.executable, "-m", "venv", str(virtualenv)], check=True)
          bindir = virtualenv / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"VIRTUAL_ENV={virtualenv}\n")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(f"{bindir}\n")
      - name: Install build and test dependencies
        run: python -m pip install "maturin>=1.9,<2" "numpy>=2.1" "pytest>=8.3"
      - name: Build extension
        run: maturin develop --locked
      - name: Test Python API
        run: pytest python/tests

  wheels:
    name: Wheel for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            docker_options: ""
          - os: ubuntu-latest
            target: aarch64
            # ring's ARM assembly needs the architecture macro when built by
            # the manylinux cross-compiler.
            docker_options: "-e CFLAGS_aarch64_unknown_linux_gnu=-D__ARM_ARCH=8"
          - os: macos-latest
            target: aarch64
            docker_options: ""
          - os: macos-15-intel
            target: x86_64
            docker_options: ""
          - os: windows-latest
            target: x64
            docker_options: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked --out dist --interpreter python3.13
          manylinux: auto
          docker-options: ${{ matrix.docker_options }}
          rust-toolchain: "1.97"
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.target }}-${{ matrix.os }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check release tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: >-
          python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; expected = f'v{version}'; actual = os.environ['GITHUB_REF_NAME']; assert actual == expected, f'release tag {actual!r} must match package version {expected!r}'"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          rust-toolchain: "1.97"
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist

  test-wheels:
    name: Python 3.13 wheel on ${{ matrix.os }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheels-x86_64-ubuntu-latest
          - os: macos-latest
            artifact: wheels-aarch64-macos-latest
          - os: macos-15-intel
            artifact: wheels-x86_64-macos-15-intel
          - os: windows-latest
            artifact: wheels-x64-windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install "numpy>=2.1" "pytest>=8.3"
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install built wheel
        run: python -c "import glob, subprocess, sys; wheel = glob.glob('dist/*.whl')[0]; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', wheel])"
      # The release wheel makes the timing-sensitive GIL checks complete too
      # quickly; those checks still run in full in the Python 3.14 matrix.
      - name: Test installed wheel
        run: python -m pytest python/tests --ignore=python/tests/test_gil.py -o pythonpath=

  publish:
    name: Publish verified distributions to PyPI
    needs: [test, wheels, sdist, test-wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fpm-rs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
