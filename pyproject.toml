[project]
name = "fpm-rs"
version = "0.2.0-beta.1"
description = "High-performance Fourier ptychography reconstruction, simulation, and diagnostics for Python, powered by Rust."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{ name = "Hernán E. Grecco", email = "hernan.grecco@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=2.1"]

[project.urls]
Documentation = "https://hgrecco.github.io/fpm-rs"
Homepage = "https://github.com/hgrecco/fpm-rs"
Issues = "https://github.com/hgrecco/fpm-rs/issues"
PyPI = "https://pypi.org/project/fpm-rs/"

[project.scripts]
fpm-datasets = "fpm_rs.datasets.cli:main"
fpm-diagnostics = "fpm_rs.diagnostics.cli:main"

[project.optional-dependencies]
notebook = ["jupyterlab>=4.3", "matplotlib>=3.9"]
plot = ["matplotlib>=3.9"]
polars = ["polars>=1"]
test = ["pytest>=8.3"]
test-full = [
  "ipython>=8.30",
  "matplotlib>=3.9",
  "polars>=1",
  "pytest>=8.3",
]
coverage = ["pytest-cov>=5"]
release = ["packaging>=24", "twine>=6"]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "python/Cargo.toml"
module-name = "fpm_rs._core"
python-source = "python"
strip = true

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["python"]
testpaths = ["python/tests"]
