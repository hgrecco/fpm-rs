[package]
name = "fpm-rs"
version = "0.1.0"
edition = "2024"
description = "Image-plane Fourier ptychographic microscopy reconstruction and simulation"
license = "MIT OR Apache-2.0"

[lib]
name = "fpm_rs"
path = "src/lib.rs"

[dependencies]
csv = "1.3"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
num-complex = { version = "0.4", features = ["serde"] }
rand = "0.9"
rand_distr = "0.5"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiff = "0.11"

[dev-dependencies]
approx = "0.5"
tempfile = "3"


[[bench]]
name = "forward_model"
harness = false
