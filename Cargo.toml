[package]
name = "fpm-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Image-plane Fourier ptychographic microscopy reconstruction and simulation"
# The Rust crate is not yet published on crates.io; link to the rustdoc built
# and deployed with the project documentation instead of a nonexistent docs.rs page.
documentation = "https://hgrecco.github.io/fpm-rs/reference/rust/"
license.workspace = true
include = [
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/Cargo.lock",
  "/Cargo.toml",
  "/LICENSE-MIT",
  "/README.md",
  "/SECURITY.md",
  "/benches/**",
  "/dataset_registry.json",
  "/dataset_spec.md",
  "/examples/**",
  "/src/**",
]

[package.metadata.docs.rs]
all-features = true

[workspace]
resolver = "3"
members = ["python"]

[workspace.package]
version = "0.2.0-beta.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
approx = "0.5"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
dirs = "6"
fpm-rs = { path = "." }
fs2 = "0.4"
image = {
  version = "0.25",
  default-features = false,
  features = ["png", "tiff"]
}
ndarray = "0.17"
num-complex = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
numpy = "0.29"
polars = { version = "0.54.4", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module"] }
rand = "0.9"
rand_distr = "0.5"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tiff = "0.11"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
uuid = { version = "1.23", features = ["v4"] }
zstd = "0.13"

[lib]
name = "fpm_rs"
path = "src/lib.rs"

[[bench]]
harness = false
name = "forward_model"

[[bench]]
harness = false
name = "gradient_parallel"

[dependencies]
clap.workspace = true
csv.workspace = true
dirs.workspace = true
fs2.workspace = true
image.workspace = true
ndarray.workspace = true
num-complex.workspace = true
num-traits.workspace = true
polars = { workspace = true, optional = true }
rand.workspace = true
rand_distr.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tiff.workspace = true
ureq.workspace = true
uuid.workspace = true
zstd.workspace = true

[dev-dependencies]
approx.workspace = true
tempfile.workspace = true

[features]
default = []
parquet = ["polars/parquet", "tabular"]
tabular = ["dep:polars"]

# Integration tests link the full scientific dependency graph into separate
# executables. Keep test artifacts small and avoid retaining incremental state
# so CI linkers have predictable memory and disk requirements.
[profile.test]
debug = 0
incremental = false
