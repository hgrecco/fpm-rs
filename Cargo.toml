[package]
name = "fpm-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Image-plane Fourier ptychographic microscopy reconstruction and simulation"
documentation = "https://docs.rs/fpm-rs"
license.workspace = true
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/LICENSE-MIT",
  "/README.md",
  "/dataset_registry.json",
  "/dataset_spec.md",
  "/examples/**",
  "/src/**",
]

[package.metadata.docs.rs]
all-features = true

[workspace]
resolver = "3"
members = ["python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
approx = "0.5"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
dirs = "6"
fpm-rs = { path = "." }
fs2 = "0.4"
image = {
  version = "0.25",
  default-features = false,
  features = ["png", "tiff"]
}
num-complex = { version = "0.4", features = ["serde"] }
ndarray = "0.17"
num-traits = "0.2"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
rand = "0.9"
rand_distr = "0.5"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tiff = "0.11"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
zstd = "0.13"

[lib]
name = "fpm_rs"
path = "src/lib.rs"

[[bench]]
harness = false
name = "forward_model"

[[bench]]
harness = false
name = "gradient_parallel"

[dependencies]
clap.workspace = true
csv.workspace = true
dirs.workspace = true
fs2.workspace = true
image.workspace = true
num-complex.workspace = true
ndarray.workspace = true
num-traits.workspace = true
rand.workspace = true
rand_distr.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tiff.workspace = true
ureq.workspace = true
zstd.workspace = true

[dev-dependencies]
approx.workspace = true
tempfile.workspace = true
